version: 2
updates:
# Create PRs for golang version updates
- package-ecosystem: docker
  directory: /
  schedule:
    interval: daily
- package-ecosystem: docker
  directory: /.test-defs
  schedule:
    interval: daily
- package-ecosystem: docker
  directory: /hack/tools/image
  schedule:
    interval: daily
  ignore:
  - dependency-name: "*"
    update-types: ["version-update:semver-minor"]
- package-ecosystem: docker
  directory: /cmd
  schedule:
    interval: daily
  ignore:
  - dependency-name: "*"
    update-types: ["version-update:semver-minor"]
